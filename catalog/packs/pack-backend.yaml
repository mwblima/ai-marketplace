name: pack-backend
displayName: Backend Pack
version: 1.0.0
kind: pack
description: >-
  Standard artifact set for backend engineers: code review plus the deployment workflow.
  Install this when you join a backend team.
category: productivity
scope: team
owner_team: backend
maturity: supported
last_reviewed: 2026-08-13
data_classification: internal
tools: [claude]
keywords: [backend, team pack, standard set, services]
dependencies:
  # A bare string tracks whatever version the marketplace provides.
  - code-review
  # An object pins a semver range. Use one only where the coupling is real and tested,
  # otherwise the pack becomes a hand-maintained lockfile nobody updates (ADR-0005).
  - name: deploy-kit
    version: ^2.0.0
