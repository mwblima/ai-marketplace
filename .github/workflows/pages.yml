name: Publish site

# Static catalog browser (ADR-0008). No framework and no bundling: the job regenerates
# docs/data/index.json from the catalog and uploads docs/ as-is.
#
# Adopters running this repository privately: GitHub Pages with private visibility requires
# GitHub Enterprise Cloud. Publishing a public site from a private repository would expose
# the internal catalog — see the hosting table in ADR-0008 before enabling this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
